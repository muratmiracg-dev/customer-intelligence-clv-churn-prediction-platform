services:
  scoring-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics-app:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir streamlit plotly pandas &&
      streamlit run App/streamlit_app.py --server.address=0.0.0.0"
    volumes:
      - .:/app:ro
    ports:
      - "8501:8501"

