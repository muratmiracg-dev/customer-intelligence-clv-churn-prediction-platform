[project]
name = "customer-intelligence-platform"
version = "1.0.0"
description = "Point-in-time customer intelligence, CLV, churn prediction and campaign targeting portfolio platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Murat Miraç Gedik" }]
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.9",
  "reportlab>=4.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
  "shap>=0.46",
  "streamlit>=1.39",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<8",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
pythonpath = ["Python/src", "."]

[tool.coverage.run]
source = ["API"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["Python/src", "tests", "API", "App"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
