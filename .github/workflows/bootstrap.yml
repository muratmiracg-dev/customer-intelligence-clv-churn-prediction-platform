name: Assemble Customer Intelligence Platform

on:
  push:
    branches:
      - agent/customer-intelligence-platform
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and publish project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/customer-intelligence-platform.zip
          echo "8a0c5aa308dc859c9f4292a0631e3d8e248e0f1f7643eab417498d9fddfffd5f  /tmp/customer-intelligence-platform.zip" | sha256sum -c -
          unzip -q /tmp/customer-intelligence-platform.zip -d /tmp/customer-intelligence-platform
          rsync -a --delete --exclude ".git/" /tmp/customer-intelligence-platform/customer-intelligence-clv-churn-prediction-platform/ ./
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build customer intelligence platform"
          git push origin HEAD:agent/customer-intelligence-platform
